<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Wishlist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h3>My Wishlist ❤️(<span id="wishlistCount">0</span>)</h3>

  <div id="wishlistContainer" class="mt-3">
    <!-- Products will load here -->
  </div>
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="wishlistToast" class="toast align-items-center text-bg-dark border-0">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">
          Message
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function loadWishlist() {

    fetch('/api/wishlist', {
      credentials: 'include'
    })
            .then(res => res.json())
            .then(data => {

              const container = document.getElementById("wishlistContainer");
              container.innerHTML = "";

              if (data.length === 0) {
                container.innerHTML = "<p>No items in wishlist</p>";
                return;
              }

              data.forEach(item => {

                const imageUrl = item.image
                        ? '/api/products/image/' + item.image
                        : '/assets/n.jpg';

                container.innerHTML += `
    <div class="card mb-3 p-3 d-flex flex-row align-items-center">

        <!-- 🔹 IMAGE (clickable) -->
        <img src="${imageUrl}"
             style="width:80px;height:80px;object-fit:cover;margin-right:15px;cursor:pointer;"
             onclick="openProduct(${item.productId})">

        <!-- 🔹 DETAILS (clickable) -->
        <div class="flex-grow-1"
             style="cursor:pointer;"
             onclick="openProduct(${item.productId})">

            <h5>${item.name}</h5>
            <p>₹ ${item.price}</p>

            <!-- 🔹 ACTIONS (NOT clickable for navigation) -->
            <div>

                <span class="text-primary me-3"
                      style="cursor:pointer;"
                      onclick="event.stopPropagation(); moveToCart(${item.id})">
                    MOVE TO CART
                </span>

                <span class="text-danger"
                      style="cursor:pointer;"
                      onclick="event.stopPropagation(); removeWishlist(${item.id})">
                    REMOVE
                </span>

            </div>
        </div>
    </div>
`;
              });
            });
  }

  function removeWishlist(id) {

    fetch('/api/wishlist/' + id, {
      method: 'DELETE',
      credentials: 'include'
    })
            .then(res => {
              if (!res.ok) throw new Error();
              return res.text();
            })
            .then(() => {
              showToast("❌ Removed from wishlist", "danger");
              updateWishlistCount();
              loadWishlist();
            })
            .catch(() => {
              showToast("⚠️ Delete failed", "danger");
            });
  }

  function moveToCart(wishlistId) {

    fetch('/api/wishlist/move-to-cart/' + wishlistId, {
      method: 'POST',
      credentials: 'include'
    })
            .then(res => {
              if (!res.ok) throw new Error("Failed");
              return res.json();
            })
            .then(data => {

              showToast(data.message || "Moved to cart", "success");

              // 🔥 FORCE reload AFTER toast
              setTimeout(() => {
                loadWishlist();
                updateWishlistCount(); // 🔥 IMPORTANT FIX
              }, 1000);

            })
            .catch(() => {
              showToast("❌ Failed to move item", "danger");
            });
  }
  document.addEventListener("DOMContentLoaded", loadWishlist);


  function openProduct(productId) {
    window.location.href = '/product/' + productId;
  }

  function updateWishlistCount() {
    fetch('/api/wishlist/count')
            .then(res => res.json())
            .then(data => {
              document.getElementById("wishlistCount").innerText = data.count;
            });
  }
  function showToast(message, type = "dark") {

    const toastEl = document.getElementById("wishlistToast");
    const msg = document.getElementById("toastMessage");

    msg.innerText = message;

    toastEl.className = `toast align-items-center text-bg-${type} border-0`;

    new bootstrap.Toast(toastEl, {
      delay: 1500   // match reload timing
    }).show();
  }
  document.addEventListener("DOMContentLoaded", function () {
    loadWishlist();
    updateWishlistCount(); // 🔥 FIXED MISSING PART
  });
</script>

</body>
</html>
